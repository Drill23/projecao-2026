name: Ensaio
# Testa o robô sem publicar nada: lê os arquivos do 1º turno (que já estão no TSE)
# por alguns ciclos e mostra o que o robô vê.
on:
  # também roda quando o arquivo pedidos/ensaio.txt muda (uma linha: caminho da configuração)
  push:
    paths: ["pedidos/ensaio.txt"]
  workflow_dispatch:
    inputs:
      config:
        description: "Arquivo de configuração (pasta eleicoes/)"
        default: "eleicoes/presidente-2026.json"
        required: true
      turno:
        description: "Turno dos arquivos a ler (1 = ensaio antes da eleição; 2 = depois)"
        default: "1"
        required: true
permissions:
  contents: write
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy requests
      - name: Ensaio
        run: |
          CFG="${{ inputs.config }}"; [ -z "$CFG" ] && CFG=$(head -1 pedidos/ensaio.txt)
          TURNO="${{ inputs.turno }}"; [ -z "$TURNO" ] && TURNO=$(sed -n 2p pedidos/ensaio.txt); [ -z "$TURNO" ] && TURNO=1
          mkdir -p logs
          python -u scripts/ao_vivo.py --config "$CFG" --turno $TURNO --ciclos 3 --intervalo 20 --diag --boot 60 2>&1 | tee logs/ensaio.txt
          cp saida/projecao.json logs/ensaio.json || true
      - name: Salvar log
        if: always()
        run: |
          git config user.name "projecao-bot"
          git config user.email "projecao-bot@users.noreply.github.com"
          git add logs
          git commit -m "Log do ensaio" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
