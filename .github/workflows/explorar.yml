name: Explorar TSE
on:
  workflow_dispatch:
  push:
    paths: ["scripts/explorar.py", ".github/workflows/explorar.yml"]
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy requests
      - run: python scripts/explorar.py
      - name: Salvar amostras
        run: |
          git config user.name "projecao-bot"
          git config user.email "projecao-bot@users.noreply.github.com"
          git add -f exploracao
          git commit -m "Amostras do TSE" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
